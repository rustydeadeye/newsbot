app = "financeai"
primary_region = "bom"

[build]

[env]
  APP_ENV = "production"
  PIPELINE_INTERVAL_SEC = "900"
  OPENAI_MODEL = "gpt-4.1-mini"
  X_API_BASE_URL = "https://api.x.com/2"
  X_TOKEN_URL = "https://api.x.com/2/oauth2/token"
  X_REDIRECT_URI = "https://financeai.fly.dev/settings/x/callback"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
