app = "newsbot"
primary_region = "bom"

[build]

[env]
  APP_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -c \"from app.workers.runner import run_cycle; print(run_cycle())\""
